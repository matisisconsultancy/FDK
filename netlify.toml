# Netlify configuration — FDK EmpowerNet
# Pure static site (HTML/CSS/JS), no build step: Netlify just serves the files.

[build]
  publish = "."

# HTML is always revalidated, so a new deploy shows up instantly (no stale cache).
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Images and other static assets carry ?v= cache-busting, so they can be cached hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Light security headers (harmless for a static marketing site).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
