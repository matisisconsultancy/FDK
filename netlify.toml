# Netlify configuration — FDK EmpowerNet
# Pure static site (HTML/CSS/JS), no build step: Netlify just serves the files.

[build]
  publish = "."

# Clean URLs: never show index.html or the .html extension in the address bar.
#   fdkempowernet.com/index.html  -> fdkempowernet.com/
#   fdkempowernet.com/thesis.html -> fdkempowernet.com/thesis   (served from thesis.html)
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true

# HTML is always revalidated, so a new deploy shows up instantly (no stale cache).
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Images and other static assets carry ?v= cache-busting, so they can be cached hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Light security headers (harmless for a static marketing site).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
