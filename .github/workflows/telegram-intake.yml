name: Telegram intake — central inbox

# ONE Telegram bot feeds the whole site. Every ~30 min this polls the bot and:
#   • photos  → data/gvi/inbox/ → GVI dashboard update (vision extraction)
#   • text    → drafts/        → article published to The Velocity Edge
# then commits & pushes so GitHub Pages redeploys.
#
# SETUP (one time): create a bot with @BotFather and add repo secrets:
#   TELEGRAM_BOT_TOKEN         — the bot token from BotFather
#   TELEGRAM_ALLOWED_CHAT_IDS  — (recommended) comma list of allowed chat/user
#                                ids, so only you/FDK can post. Send /id to the
#                                bot and read the collector log to find yours.
#   ANTHROPIC_API_KEY          — already set (used to read infographics & format text)
#
# NOTE: GitHub only runs `schedule:` from the repository's DEFAULT branch, so
# the timed polling begins once this workflow is merged there. Until then use
# the Actions tab → "Run workflow".

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch: {}

concurrency:
  group: telegram-intake-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect Telegram messages
        id: collect
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
        run: node scripts/telegram-collector.mjs

      - name: Ingest infographics → dashboard
        if: steps.collect.outputs.photos != '0' && steps.collect.outputs.photos != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GVI_VISION_MODEL: ${{ vars.GVI_VISION_MODEL }}
        run: |
          node scripts/gvi-ingest.mjs
          node scripts/gvi-build.mjs

      - name: Publish text drafts → article library
        if: steps.collect.outputs.drafts != '0' && steps.collect.outputs.drafts != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/process-drafts.mjs

      - name: Commit and push
        run: |
          git config user.name  "velocity-edge-bot"
          git config user.email "matisisconsultancy@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Telegram intake: refresh dashboard / publish notes"
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push failed (attempt $attempt), retrying…"
            sleep $((attempt * 3))
          done
          echo "::error::Failed to push after 4 attempts"
          exit 1
