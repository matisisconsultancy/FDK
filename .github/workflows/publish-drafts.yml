name: Publish drafts — The Velocity Edge

# When a draft lands under drafts/, format it (AI if free-form), build the
# note page, update posts.js + sitemap.xml, archive the draft, and push the
# result back so GitHub Pages redeploys with the new note live.

on:
  push:
    branches:
      - claude/eager-carson-vjorjg
      - claude/ai-capital-allocation-5uragv
    paths:
      - "drafts/**"
  workflow_dispatch: {}

concurrency:
  group: publish-drafts-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # allow re-running the Pages build on transient GitHub timeouts

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Process drafts
        id: process
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/process-drafts.mjs

      # A new note goes live in English straight away; the dictionaries are
      # rebuilt so the shared copy around it still reads in ES/IT, and the log
      # lists exactly which new strings need translating.
      - name: Rebuild translation dictionaries
        if: steps.process.outputs.published != '0' && steps.process.outputs.published != ''
        run: |
          node scripts/i18n-build.mjs
          echo "--- strings awaiting translation ---"
          node scripts/i18n-extract.mjs

      # Publishing never waits for translation, but it must not be silent about
      # it either: until a note is translated it renders in English whichever
      # language the reader picks, which looks like a broken switcher. Surface
      # the count on the run summary instead of burying it in the log.
      - name: Report untranslated notes
        if: steps.process.outputs.published != '0' && steps.process.outputs.published != ''
        run: |
          if node scripts/i18n-build.mjs --check > /tmp/i18n-check.txt 2>&1; then
            echo "### Translations complete" >> "$GITHUB_STEP_SUMMARY"
            echo "Every string on the new note is already in ES and IT." >> "$GITHUB_STEP_SUMMARY"
          else
            MISSING=$(grep -oE 'MISSING [0-9]+' /tmp/i18n-check.txt | head -1 | grep -oE '[0-9]+')
            echo "::warning title=Note published in English::${MISSING:-some} strings still need ES/IT translation. Until then the language switcher changes the shell but leaves the article in English."
            {
              echo "### :warning: Published in English"
              echo ""
              echo "**${MISSING:-Some} strings** on the new note have no Spanish or Italian yet."
              echo "The switcher will change the navigation and dates but leave the article in English."
              echo ""
              echo "To finish it: translate the strings, run \`node scripts/i18n-build.mjs\`, and push."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit and push
        if: steps.process.outputs.published != '0' && steps.process.outputs.published != ''
        run: |
          git config user.name  "velocity-edge-bot"
          git config user.email "matisisconsultancy@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Publish ${{ steps.process.outputs.published }} note(s) from drafts"
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push failed (attempt $attempt), retrying…"
            sleep $((attempt * 3))
          done
          echo "::error::Failed to push after 4 attempts"
          exit 1

      - name: Ensure Pages deployment (self-heal transient GitHub timeouts)
        if: steps.process.outputs.published != '0' && steps.process.outputs.published != ''
        continue-on-error: true   # best-effort: never fail the publish over this
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set +e
          echo "Giving the GitHub Pages build a moment to start…"
          sleep 45
          max_attempts=3
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            run_id=$(gh run list --branch "$BRANCH" --workflow "pages build and deployment" \
              --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null)
            if [ -z "$run_id" ]; then
              echo "No Pages build visible yet; waiting…"; sleep 20; attempt=$((attempt+1)); continue
            fi
            echo "Watching Pages build $run_id (attempt $attempt/$max_attempts)…"
            gh run watch "$run_id" >/dev/null 2>&1
            status=$(gh run view "$run_id" --json conclusion -q '.conclusion' 2>/dev/null)
            echo "Pages build $run_id conclusion: $status"
            if [ "$status" = "success" ]; then
              echo "✅ Pages deployed."; exit 0
            fi
            echo "⚠ Pages deploy did not succeed ($status). Re-running…"
            gh run rerun "$run_id" >/dev/null 2>&1 || gh run rerun "$run_id" --failed >/dev/null 2>&1 || true
            sleep 30
            attempt=$((attempt+1))
          done
          echo "::warning::Pages still not deployed after $max_attempts attempts — likely a GitHub Pages incident. The note is committed and will deploy once GitHub recovers."
